map_server:
  ros__parameters:
    yaml_filename: ''
    use_sim_time: true

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    tf_broadcast: true
    transform_tolerance: 1.0
    laser_model_type: likelihood_field_prob
    do_beamskip: true
    laser_min_range: 0.05
    laser_max_range: 5.0
    max_beams: 120
    min_particles: 300
    max_particles: 1500
    update_min_d: 0.05
    update_min_a: 0.08
    z_hit: 0.80
    z_rand: 0.15
    z_short: 0.05
    z_max: 0.05
    sigma_hit: 0.10
    set_initial_pose: true
    always_reset_initial_pose: true
