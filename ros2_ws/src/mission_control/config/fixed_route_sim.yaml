# 仿真初值，非实车标定。单位 m / rad / s；原点为场地右下角。
# +X=旧图+Y，+Y=旧图-X；yaw=0朝+X，pi/2朝+Y。
# 所有 photo_pose / drop_pose / transit_points 均为 base_footprint 车中心。
version: sim-2026-11-23-south-approach-v2
simulation_only: true
frame: field
order: [A, B, C, D]
start_pose: {x: 1.0, y: 0.30, yaw: 1.5707963267948966}

scene:
  field: {x_min: 0.0, x_max: 2.0, y_min: 0.0, y_max: 3.02}
  destination: {x_min: 0.30, x_max: 1.70, y_min: 2.22, y_max: 3.02}
  # 保守外接矩形，覆盖当前CAD底盘。未来实车应加入托叉/线缆等突出物。
  robot: {length: 0.25, width: 0.25}
  rack: {gap: 0.35, wall_thickness: 0.025, depth: 0.15, height: 0.23, qr_height: 0.25}
  markers:
    S: {x: 0.60, y: 0.60, radius: 0.05}
    E: {x: 0.30, y: 2.22, radius: 0.05}
  clearance_m: 0.005

control:
  # 仅适用于理想仿真；不是实车速度建议。
  cruise_mps: 0.45
  loaded_mps: 0.40
  approach_mps: 0.18
  turn_rps: 1.5
  acceleration_mps2: 1.0
  angular_acceleration_rps2: 4.0
  position_tolerance_m: 0.006
  yaw_tolerance_rad: 0.012
  max_cross_track_m: 0.045
  max_heading_error_rad: 0.30
  settle_s: 0.12
  stopped_linear_mps: 0.01
  stopped_angular_rps: 0.02
  feedback_timeout_s: 0.50
  scan_timeout_s: 0.75
  cargo_timeout_s: 1.0
  image_timeout_s: 3.0
  no_progress_s: 3.0
  segment_timeout_s: 20.0
  effect_timeout_s: 5.0
  # 独立单调墙钟上限，含拍照、等待；Gazebo太慢也会截止。
  mission_timeout_s: 180.0

timing: {photo_dwell_s: 0.4, lift_wait_s: 0.6, lower_wait_s: 0.6}
simulation: {lift_height_m: 0.06, cargo_alignment_m: 0.025, cargo_alignment_rad: 0.05}

# 固定通道折点。程序只连接已写好的点，不做在线规划/绕障。
transit_points:
  a_south_lane: [1.00, 1.545]
  b_return_lane: [1.00, 2.47]
  b_south_lane: [1.00, 0.845]
  b_clear_lane: [1.00, 1.395]
  b_drop_lane: [1.25, 2.47]
  c_south_lane: [1.25, 1.345]
  d_return_lane: [1.00, 2.05]
  d_south_lane: [1.00, 0.845]

racks:
  A:
    model: rack_a
    pose: {x: 0.550, y: 1.895, yaw: 0.0}
    # 取货时车中心相对货架的位姿；真实托叉偏移在此标定。
    pickup_offset: {x: 0.0, y: 0.0, yaw: 1.5707963267948966}
    photo_pose: {x: 0.550, y: 1.545, yaw: 1.5707963267948966}
    enter_distance_m: 0.35
    # 举升后继续向+Y前进，再略向右上方直达放置位，避让E柱。
    clear_direction: forward
    clear_distance_m: 0.16
    drop_pose: {x: 0.65, y: 2.82, yaw: 1.5707963267948966}
    exit_distance_m: 0.35
    to_photo: [a_south_lane]
    to_drop: []
  B:
    model: rack_b
    pose: {x: 1.360, y: 1.195, yaw: 0.0}
    pickup_offset: {x: 0.0, y: 0.0, yaw: 1.5707963267948966}
    photo_pose: {x: 1.360, y: 0.845, yaw: 1.5707963267948966}
    enter_distance_m: 0.35
    # 前进离架后向西进入中间通道，避让上方尚未搬走的C。
    clear_direction: forward
    clear_distance_m: 0.20
    drop_pose: {x: 1.25, y: 2.82, yaw: 1.5707963267948966}
    exit_distance_m: 0.35
    to_photo: [b_return_lane, b_south_lane]
    to_drop: [b_clear_lane, b_return_lane, b_drop_lane]
  C:
    model: rack_c
    pose: {x: 1.670, y: 1.695, yaw: 0.0}
    pickup_offset: {x: 0.0, y: 0.0, yaw: 1.5707963267948966}
    photo_pose: {x: 1.670, y: 1.345, yaw: 1.5707963267948966}
    enter_distance_m: 0.35
    clear_distance_m: 0.35
    clear_direction: forward
    drop_pose: {x: 0.65, y: 2.40, yaw: 1.5707963267948966}
    exit_distance_m: 0.35
    to_photo: [c_south_lane]
    to_drop: []
  D:
    model: rack_d
    pose: {x: 0.410, y: 1.095, yaw: 0.0}
    pickup_offset: {x: 0.0, y: 0.0, yaw: 1.5707963267948966}
    # 拍照位高于S柱，避免横向接近时扫到柱体。
    photo_pose: {x: 0.410, y: 0.845, yaw: 1.5707963267948966}
    enter_distance_m: 0.25
    clear_distance_m: 0.35
    clear_direction: forward
    drop_pose: {x: 1.25, y: 2.40, yaw: 1.5707963267948966}
    exit_distance_m: 0.35
    to_photo: [d_return_lane, d_south_lane]
    to_drop: []
