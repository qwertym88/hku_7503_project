amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.10
    alpha2: 0.10
    alpha3: 0.10
    alpha4: 0.10
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    tf_broadcast: true
    transform_tolerance: 0.35
    laser_model_type: likelihood_field_prob
    do_beamskip: true
    beam_skip_distance: 0.20
    beam_skip_threshold: 0.30
    beam_skip_error_threshold: 0.90
    laser_min_range: 0.05
    laser_max_range: 5.0
    max_beams: 120
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.02
    update_min_a: 0.04
    z_hit: 0.85
    z_rand: 0.15
    sigma_hit: 0.07
    set_initial_pose: true
