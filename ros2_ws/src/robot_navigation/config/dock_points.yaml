# 停靠点标定（M4-7）—— 场地坐标硬编码见《HANDOFF》§4（原点左下角，单位 m，yaw 为弧度）
# ⚠️ 这些是按图纸几何推算的初值，装车后必须实测微调（相机能否扫到 QR、托叉能否伸入货架）。
#
# 接近点算法：车中心 = 货架中心 - 朝向偏移 0.25 m（车半长 0.15 + 货架半宽 0.07 + 余量 0.03），
# 即车前缘刚好伸到货架中心线下方。approach_offset 按举升机构实测调整。
#
# 货架朝向的通道侧（唯一可接近方向）：
#   Rack A (1.20,1.58) 上排左 → 从南侧中间通道接近（车朝 +Y）
#   Rack B (1.85,0.51) 下排右 → 从北侧中间通道接近（车朝 -Y）
#   Rack C (1.85,1.72) 上排右 → 从南侧中间通道接近（车朝 +Y）
#   Rack D (1.35,0.37) 下排左 → 从北侧中间通道接近（车朝 -Y）

# 车前缘伸入货架下方的距离（车中心到目标点的距离），装车后实测调整
approach_offset: 0.25

# 比赛出生点：Start 区中心，车头朝 -X（场地内部）
start:
  x: 2.72
  y: 1.00
  yaw: 3.14159

# 目的区停放点：Destination 中心（x 0.00~0.80, y 0.30~1.70）
destination:
  x: 0.40
  y: 1.00
  yaw: 3.14159

# 四个货架的接近停靠点（车到达后：扫码确认 → 举升）
rack_a:
  x: 1.20
  y: 1.33
  yaw: 1.5708     # 朝 +Y
rack_b:
  x: 1.85
  y: 0.76
  yaw: -1.5708    # 朝 -Y
rack_c:
  x: 1.85
  y: 1.40
  yaw: 1.5708     # 朝 +Y
rack_d:
  x: 1.35
  y: 0.62
  yaw: -1.5708    # 朝 -Y
